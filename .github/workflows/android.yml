name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Generate the standard Android Gradle project files missing from this repository.
      - run: flutter create --platforms=android --project-name naeemsoft_pos .
      # Flutter's generated counter test targets MyApp; this project uses NaeemSoftApp.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: NaeemSoft-POS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
