name: Android APK
on:
  push:
    branches: [main, feature/independent-invoices-no-stock]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Generate the standard Android Gradle project files missing from this repository.
      - run: flutter create --platforms=android --project-name naeemsoft_pos .
      # Pin Gradle's generated distribution URL to a mirror that avoids GitHub's intermittent 504 redirects.
      - name: Configure Gradle and Maven mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          content = path.read_text()
          match = re.search(r"gradle-([0-9.]+)-bin\.zip", content)
          if not match:
              raise SystemExit("Could not detect generated Gradle version")
          version = match.group(1)
          url = f"distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v{version}/gradle-{version}-bin.zip"
          content = re.sub(r"^distributionUrl=.*$", url, content, flags=re.MULTILINE)
          path.write_text(content)
          print(f"Configured Gradle {version} mirror: {url}")
          PY
          sed -i 's#mavenCentral()#maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2") }; mavenCentral()#g' android/settings.gradle.kts android/build.gradle.kts
      # Flutter's generated counter test targets MyApp; this project uses NaeemSoftApp.
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - name: Build APK with network retry
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Gradle download failed on attempt $attempt; retrying..."
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: NaeemSoft-POS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
